[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-audio-studio"
version = "0.1.0"
description = "Aplicativo desktop local para conversao de texto em audio e audio em texto."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "soundfile>=0.12",
  "pocket-tts[quantize]>=3.3.0",
  "moondream>=2.4.1",
  "httpx>=0.27",
  "huggingface_hub>=0.24.0",
  "pynput>=1.7.7",
  "num2words>=0.5.14",
  "psutil>=5.9",
]

[project.optional-dependencies]
asr-fallback = ["transformers>=4.57.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
joe = "joe.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joe = ["resources/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
