name: Python checks

on:
  push:
    branches:
      - feature/desktop-audio-studio
      - feature/colab-model-api
      - feature/joe-studio-improvements
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest httpx numpy scipy soundfile "num2words>=0.5.14"
      - name: Compile Python sources
        run: python -m compileall -q src/joe colab/api_server.py
      - name: Validate Colab notebook JSON
        run: python -c "import json; from pathlib import Path; json.loads(Path('colab/Joe_Colab_API.ipynb').read_text(encoding='utf-8'))"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
