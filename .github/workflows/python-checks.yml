name: Python checks

on:
  push:
    branches:
      - feature/desktop-audio-studio
      - feature/colab-model-api
      - feature/joe-studio-improvements
      - feature/pocket-tts-cuda-performance
      - feature/pocket-tts-advanced-settings
      - fix/history-tab-performance
      - feature/clipboard-interactive-phrases
      - fix/colab-safetensors-voice-state
      - feat/colab-drive-model-autosync
      - fix/colab-tts-safetensors-diagnostics
      - fix/colab-safetensors-upload-suffix
      - feature/colab-drive-direct-assets
      - fix/colab-pocket-tts-inference-quality
      - fix/colab-drive-voice-id-409
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-xkb1 libxcb-render-util0
      - name: Install lightweight test dependencies
        run: python -m pip install pytest httpx numpy scipy soundfile psutil PySide6 PyYAML "num2words>=0.5.14"
      - name: Compile Python sources
        run: python -m compileall -q src/joe colab
      - name: Validate Colab notebook JSON
        run: python -c "import json; from pathlib import Path; json.loads(Path('colab/Joe_Colab_API.ipynb').read_text(encoding='utf-8'))"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
